# VEDHA — LOCAL DEV compose (all services including probe).
#
# ⚠️  PRODUCTION DEPLOYMENT: use manager/docker-compose.yml via deploy/aws/install.sh
#     That file sparse-clones only manager/ + deploy/ so probe source never lands
#     on the AWS host. This file is for LOCAL development only.
#
#   cp .env.docker.example .env
#   docker compose up -d --build                           # core (postgres+redis+migrate+api)
#   docker compose --profile ui up -d --build              # + Next.js frontend
#   docker compose --profile probe up -d --build           # + local probe (testing only)
#   docker compose --profile graph up -d                   # + Neo4j attack-path graph
#   docker compose --profile local-ai up -d               # + Ollama local LLM
#
# Project name → container/network/volume prefix (vedha-api-1, vedha_pgdata, …).
name: vedha

x-backend-image: &backend-image
  build:
    context: ./manager/backend
    additional_contexts:
      # P1: detection_engine baked into the image (COPY --from=detection_engine
      # in the backend Dockerfile) — self-contained, no runtime mount/drift.
      detection_engine: ./manager/detection_engine
    args:
      INSTALL_EXTRAS: ${INSTALL_EXTRAS:-0}
      VEDHA_VERSION: ${VEDHA_VERSION:-dev}
  image: vedha-backend:local

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vapt}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-vapt_db}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-change-me-at-least-32-chars-long!!}
  PROBE_POLICY_SIGNING_KEY: ${PROBE_POLICY_SIGNING_KEY:-}
  APP_ENV: ${APP_ENV:-development}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  NEO4J_ENABLED: ${NEO4J_ENABLED:-false}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-vedha-neo4j}
  # AI execution is Manager-only. Provider keys are never injected into the UI.
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-180}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://vedha.local}
  OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Vedha}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
  # detection_engine (sibling project) is mounted into the api container and
  # imported from here — it runs on raw probe facts to produce CVE findings.
  DETECTION_ENGINE_PATH: /opt/detection_engine

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vapt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-vapt_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Internal-only by default — the API reaches Postgres over the compose
    # network, so we don't publish 5432 to the host (avoids "port already
    # allocated" clashes with a local Postgres). To inspect from the host, set
    # POSTGRES_PORT in .env and uncomment:
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vapt} -d ${POSTGRES_DB:-vapt_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Internal-only by default (see Postgres note). Uncomment to expose:
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-vedha-neo4j}
    # LOCAL DEV only — bound to 127.0.0.1 to avoid exposing Neo4j on LAN.
    # Production: ports are commented out in manager/docker-compose.yml.
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: apply migrations + seed admin, then exit. `api` waits for success.
  migrate:
    <<: [*backend-image]
    environment:
      <<: *backend-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@vedha.io}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      SEED_TENANT_NAME: ${SEED_TENANT_NAME:-Default Tenant}
      # Set true in .env to rotate/recover the admin password on next `migrate` run.
      SEED_ADMIN_FORCE_RESET: ${SEED_ADMIN_FORCE_RESET:-false}
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed_admin.py"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: [*backend-image]
    environment:
      <<: *backend-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${API_WORKERS:-4}"]
    # detection_engine is now BAKED into the image (P1) at /opt/detection_engine
    # — no runtime mount. The manager owns the vuln DB; the probe never sees it.
    # LOCAL DEV: bind to 127.0.0.1 so the raw API is not reachable from LAN.
    # Production install.sh enforces this via manager/docker-compose.yml.
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional deployment-managed free/open-source runtime. The one-shot init
  # service pulls the selected model into a persistent volume during deployment.
  # Set OLLAMA_BASE_URL=http://ollama:11434 when enabling this profile.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    volumes:
      - ollama_models:/root/.ollama
    # Internal-only: Manager reaches Ollama over the Compose network.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama-model-init:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_models:/root/.ollama
    command: ["pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Durable background worker — drains the transactional outbox (outbox_events)
  # and runs the detection pipeline off the request path. Shares the backend
  # image (same code + baked detection_engine + pinned vuln DB). Scale it
  # horizontally with `docker compose up -d --scale worker=N`; FOR UPDATE SKIP
  # LOCKED makes concurrent workers claim disjoint events safely.
  worker:
    <<: [*backend-image]
    environment:
      <<: *backend-env
    command: ["python", "-m", "app.workers.outbox"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional in-stack probe for local testing (real probes deploy on remote
  # networks — see docs/RUNBOOK.md Part B / probe/README.md). Self-registers using the seeded operator.
  probe:
    # The probe IS scanner_module (engine + agent transport). Builds from the
    # sibling scanner_module/ — one scan codebase, no duplicate.
    build:
      context: ./probe
    image: vedha-probe:local
    profiles: ["probe"]
    environment:
      PLATFORM_URL: http://api:8000
      OPERATOR_EMAIL: ${SEED_ADMIN_EMAIL:-admin@vedha.io}
      OPERATOR_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      PROBE_NAME: ${PROBE_NAME:-local-probe}
      # Required execution ceiling and manager routing declaration. Empty is
      # intentionally fail-closed: the probe exits until configured.
      PROBE_NETWORK_SEGMENTS: ${PROBE_NETWORK_SEGMENTS:-}
      PROBE_MAX_TARGETS: ${PROBE_MAX_TARGETS:-4096}
      PROBE_MAX_JOB_SECONDS: ${PROBE_MAX_JOB_SECONDS:-7200}
      LICENSE_ENFORCED: "false"   # container host-ID changes each restart; skip host-lock check
    volumes:
      - probestate:/var/lib/vedha-probe   # persist identity so restarts reuse the same agent
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    init: true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Centralized dashboard (Next.js). Talks to the API server-side via a BFF
  # (BACKEND_INTERNAL_URL) — no CORS, single FastAPI JWT. It never scans the
  # network itself; every scan is dispatched through Manager to the Probe.
  frontend:
    build:
      context: ./manager/frontend
    image: vedha-frontend:local
    profiles: ["ui"]
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
      MANAGER_PUBLIC_URL: ${MANAGER_PUBLIC_URL:-http://host.docker.internal:18080}
      AUTH_SECRET: ${JWT_SECRET:-change-me-at-least-32-chars-long!!}
      # LOCAL DEV: false is OK over HTTP. Production install sets this to true.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
  probestate:
  ollama_models:
