name: backend-ci

# The manager backend and the detection engine it bakes in. Until this job they
# ran nowhere in CI, so ~3,000 tests protected no merge. Both suites are
# hermetic unit tests (fakes and mocks): no Postgres, Redis or Neo4j needed.
on:
  push:
    branches: [main]
    paths:
      - 'manager/backend/**'
      - 'manager/detection_engine/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'manager/backend/**'
      - 'manager/detection_engine/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch: {}

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: manager/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'          # matches manager/backend/Dockerfile
          cache: pip
          cache-dependency-path: manager/backend/requirements.txt
      # requirements.txt is the declared full set, test pins included.
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  detection-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: manager/detection_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Standard library only at runtime.
      - run: python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0
      - run: python -m pytest -q
