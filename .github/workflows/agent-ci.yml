name: vedha-agent-ci

on:
  pull_request:
    paths:
      - "probe/agent/**"
      - "probe/tests/**"
      - "probe/install.*"
      - "probe/requirements-runtime.txt"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime deps + pytest
        run: python -m pip install -r requirements-runtime.txt pytest 'pytest-asyncio>=1,<2'
      - name: Unit tests (hardened-agent modules)
        run: >-
          python -m pytest -q
          tests/test_scope_model.py tests/test_config_model.py tests/test_doctor.py
          tests/test_exit_state.py tests/test_supervisor.py tests/test_result_queue.py
          tests/test_self_scan.py tests/test_connect.py tests/test_bootstrap.py
          tests/test_deps.py tests/test_setup_cli.py tests/test_obs.py
          tests/test_service.py tests/test_release.py tests/test_kernel_limits.py
          tests/test_feasibility.py tests/test_run_timing.py
          tests/test_oversized_result.py tests/test_cache_host_index.py
          tests/test_ws_claim_race.py tests/test_stage_boundary_commits.py
          tests/test_lease_patience.py tests/test_spool_backpressure.py
          tests/test_infeasible_job_admission.py tests/test_kernel_admission.py
          tests/test_ws_reconnect_serialization.py tests/test_phased_admission.py
          tests/test_intensity_envelope.py
          tests/test_banner_pass_concurrency.py tests/test_stage_fanout_policy.py
          tests/test_tail_budget.py tests/test_syn_coverage_and_pacing.py
          tests/test_hw_bind.py tests/test_sealed_gate.py
      - name: Installer contract (POSIX sh; the curl | sh path customers run)
        if: runner.os != 'Windows'
        run: |
          sh -n install.sh
          python -m pytest -q tests/test_installer_contract.py
      - name: doctor smoke (exits 0 on a healthy host)
        run: python -m agent.setup doctor
      - name: Generate SBOM (CycloneDX)
        run: python -m agent.release sbom --out sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.os }}
          path: probe/sbom.cdx.json
