name: vedha-agent-windows-build

# Builds the compiled Windows agent on a real Windows runner and proves it:
#   * only the agent's own code is compiled in (tools/agent_closure.py --check),
#   * the output folder holds no Python source or bytecode of ours,
#   * the compiled binary can import every module the agent loads lazily
#     (vedha-agent runtime-check),
#   * it starts and answers `version` / `hostid` / `manifest`,
#   * the install and package scripts parse as PowerShell and their logic passes its
#     tests under BOTH PowerShell 7 and Windows PowerShell 5.1 (what customers have),
#   * the customer package is then installed, diagnosed, repaired and removed for real
#     on this Windows runner (windows/tests/Test-InstallE2E.ps1): scheduled task,
#     permissions, logs, doctor / status / support-bundle, failure messages.
# The zip is uploaded as a workflow artifact; publishing it to the manager is a
# separate, deliberate step. Run it manually (Run workflow) and fill in manager_url to
# get a package that already carries your manager's address.
on:
  pull_request:
    paths:
      - "probe/agent/**"
      - "probe/scanner/**"
      - "probe/workflow/**"
      - "probe/windows/**"
      - "probe/tools/agent_closure.py"
      - "probe/requirements-runtime.txt"
      - ".github/workflows/agent-windows-build.yml"
  workflow_dispatch:
    inputs:
      manager_url:
        description: "Manager address baked into the customer package (https://...)"
        required: false
        default: "https://api.vedhasec.com"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Closure check (only the agent's own code is compiled)
        run: python tools/agent_closure.py --check

      - name: PowerShell scripts parse
        run: |
          foreach ($f in 'windows\build-agent-exe.ps1','windows\python-env.ps1','windows\install.ps1','windows\uninstall.ps1','windows\package-zip.ps1','windows\publish-release.ps1','windows\tests\Test-PublishRelease.ps1','windows\setup.ps1','windows\tests\Test-Install.ps1','windows\tests\Test-InstallE2E.ps1','windows\hosting\get.ps1','windows\hosting\tests\Test-Get.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$f : $($_.Message)" }; exit 1 }
            Write-Host "ok  $f"
          }

      - name: Installer logic tests (PowerShell 7)
        run: pwsh -NoProfile -File windows\tests\Test-Install.ps1

      - name: Installer logic tests (Windows PowerShell 5.1, what customers run)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows\tests\Test-Install.ps1

      - name: Vendor one-command release script tests (PowerShell 7)
        run: pwsh -NoProfile -File windows\tests\Test-PublishRelease.ps1

      - name: Hosted one-command download tests (PowerShell 7)
        run: pwsh -NoProfile -File windows\hosting\tests\Test-Get.ps1

      - name: Hosted one-command download tests (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows\hosting\tests\Test-Get.ps1

      # Nuitka downloads its own gcc and keeps a ccache of compiled C objects here.
      # Restoring it makes a re-run minutes instead of ~35. Saved even if a later
      # step fails, so a fix to a late step does not pay for the compile again.
      - name: Restore Nuitka cache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-win-${{ hashFiles('probe/requirements-runtime.txt') }}-${{ github.run_id }}
          restore-keys: |
            nuitka-win-${{ hashFiles('probe/requirements-runtime.txt') }}-

      - name: Build the compiled agent (Nuitka)
        run: powershell -ExecutionPolicy Bypass -File windows\build-agent-exe.ps1

      - name: Save Nuitka cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-win-${{ hashFiles('probe/requirements-runtime.txt') }}-${{ github.run_id }}

      - name: Smoke test the compiled agent
        run: |
          $exe = 'windows\dist\vedha-agent\vedha-agent.exe'
          & $exe version;  if ($LASTEXITCODE -ne 0) { exit 1 }
          & $exe hostid;   if ($LASTEXITCODE -ne 0) { exit 1 }
          & $exe runtime-check; if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:LICENSE_ENFORCED = 'false'
          $manifest = & $exe manifest | ConvertFrom-Json
          if (-not $manifest.capabilities) { Write-Error 'manifest has no capabilities'; exit 1 }
          Write-Host "manifest ok: $($manifest.capabilities.Count) capabilities"

      - name: Troubleshooting commands work in the compiled agent
        run: |
          $exe = 'windows\dist\vedha-agent\vedha-agent.exe'
          $help = & $exe help | Out-String
          foreach ($word in 'doctor','status','support-bundle') { if ($help -notmatch $word) { Write-Error "help does not list $word"; exit 1 } }
          & $exe nonsense-command | Out-Null
          if ($LASTEXITCODE -ne 2) { Write-Error "an unknown command must exit 2 (got $LASTEXITCODE)"; exit 1 }
          $env:PLATFORM_URL = 'https://127.0.0.1:9'
          $out = & $exe doctor --preinstall | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'cannot connect to 127.0.0.1:9') { Write-Error 'doctor did not diagnose an unreachable manager'; exit 1 }
          # The runner ends this step with the last native exit code; doctor's 1 was the expected answer.
          $global:LASTEXITCODE = 0

      - name: No source or bytecode of ours in the output
        run: |
          $dist = (Resolve-Path 'windows\dist\vedha-agent').Path
          $bad = Get-ChildItem $dist -Recurse -File -Include *.py,*.pyc |
            Where-Object { $_.FullName.Substring($dist.Length + 1) -match '^(agent|scanner|workflow|main_scripts|cve|tests)\\' }
          if ($bad) { $bad | ForEach-Object { Write-Error "shipped: $($_.FullName)" }; exit 1 }
          if (Get-ChildItem $dist -Recurse -File -Filter 'findings*') { Write-Error 'findings module present'; exit 1 }
          Write-Host 'clean'

      - name: Package
        env:
          MANAGER_URL: ${{ inputs.manager_url || 'https://api.example.invalid' }}
        run: powershell -ExecutionPolicy Bypass -File windows\package-zip.ps1 -Manager $env:MANAGER_URL

      - name: Install the customer package for real (end to end)
        run: pwsh -NoProfile -File windows\tests\Test-InstallE2E.ps1 -ZipPath windows\dist\vedha-agent-win.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vedha-agent-windows
          path: |
            probe/windows/dist/vedha-agent-win.zip
            probe/windows/dist/vedha-agent-win.zip.sha256
            probe/windows/dist/vedha-agent-win.release.json
