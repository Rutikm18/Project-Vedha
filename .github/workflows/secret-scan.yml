
name: secret-scan

# SEC-01 CI gate: fail any push/PR that introduces a verified secret.
# Scans full history on push so a secret reintroduced on a branch is caught
# even if a developer bypassed the local pre-commit hook.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pull-requests: read   # gitleaks-action lists a PR's commits with the token

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required by gitleaks-action v2 on pull_request events.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          # Read-only token: report in the job summary, not as PR comments.
          GITLEAKS_ENABLE_COMMENTS: "false"
