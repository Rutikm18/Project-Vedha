
name: secret-scan

# SEC-01 CI gate: fail any push/PR that introduces a verified secret.
# Scans full history on push so a secret reintroduced on a branch is caught
# even if a developer bypassed the local pre-commit hook.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  # gitleaks-action lists a pull request's commits through the API.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required by gitleaks-action to scan pull requests (it fails without it).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
