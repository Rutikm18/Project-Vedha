name: images

# Build the API and dashboard images in CI and push them to GitHub Container
# Registry, tagged with the first 12 characters of the commit. That is exactly the
# release id deploy/aws/install.sh uses, so a host with VEDHA_IMAGE_REGISTRY set
# pulls the image (seconds, no CPU) instead of compiling it. Hosts that do not set
# it keep building locally; nothing else changes.
#
# These are the same images `docker compose build` makes by default: Alpine base,
# no ML extras (the optional `make up-ai` image is not published).
on:
  push:
    branches: [main]
    paths:
      - 'manager/backend/**'
      - 'manager/frontend/**'
      - 'manager/detection_engine/**'
      - 'VERSION'
      - '.github/workflows/images.yml'
  workflow_dispatch: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vedha-backend
            context: manager/backend
            contexts: detection_engine=manager/detection_engine
          - name: vedha-frontend
            context: manager/frontend
            contexts: ""
    steps:
      - uses: actions/checkout@v4
      - name: Names and tags
        id: meta
        run: |
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.contexts }}
          build-args: |
            VEDHA_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:main
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max
