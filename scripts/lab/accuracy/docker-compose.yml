# Accuracy lab: one positive and one clean control per check (gap 4: TLS, EOL OS,
# databases, Terrapin). Every image is pinned; nothing here is reachable from outside
# the lab bridge. Run through run_lab.py, which scans each target with the probe's
# real scanners and grades the manager's findings against ground_truth.json.
#
# DELIBERATELY VULNERABLE. Never publish these ports or attach this network to a LAN.
name: vedha-accuracy-lab

networks:
  lab:
    driver: bridge
    internal: true            # no route out; the host reaches the bridge directly
    ipam:
      config:
        - subnet: 172.31.250.0/24

x-tls: &tls
  image: python:3.12-slim
  volumes:
    - ./tls_server.py:/srv/tls_server.py:ro
    - ./certs:/srv/certs:ro
  read_only: true

services:
  # ── Terrapin (CVE-2023-48795) ──────────────────────────────────────────────
  ssh-terrapin:               # OpenSSH 9.3p2, built 10 Dec 2023: chacha20, no strict kex
    image: linuxserver/openssh-server:version-9.3_p2-r0
    environment: [PUID=1000, PGID=1000, USER_NAME=lab, PASSWORD_ACCESS=false]
    networks: {lab: {ipv4_address: 172.31.250.11}}
  ssh-current:                # OpenSSH 10.3: strict kex advertised (clean control)
    image: linuxserver/openssh-server:version-10.3_p1-r1
    environment: [PUID=1000, PGID=1000, USER_NAME=lab, PASSWORD_ACCESS=false]
    networks: {lab: {ipv4_address: 172.31.250.12}}

  # ── end-of-life OS, read from the SSH banner ───────────────────────────────
  eol-ubuntu1604:             # "OpenSSH_7.2p2 Ubuntu-4ubuntu2.x": Ubuntu 16.04 (EOL)
    image: rastasheep/ubuntu-sshd:16.04
    networks: {lab: {ipv4_address: 172.31.250.21}}
  supported-debian12:         # "OpenSSH_9.2p1 Debian-2+deb12uN": Debian 12 (supported)
    image: atmoz/sftp:debian
    command: ["lab:lab-only-not-a-secret:1001"]
    networks: {lab: {ipv4_address: 172.31.250.22}}

  # ── TLS ────────────────────────────────────────────────────────────────────
  tls-weak:                   # TLS 1.0/1.1, 3DES, 1024-bit RSA, expired certificate
    <<: *tls
    command: ["python", "/srv/tls_server.py", "weak"]
    networks: {lab: {ipv4_address: 172.31.250.31}}
  tls-anon:                   # TLS 1.2 with anonymous DH as the ONLY cipher (no server
    <<: *tls                  # authentication): the scanner must negotiate it, since it
    command: ["python", "/srv/tls_server.py", "anon"]   # reads the preferred cipher only
    networks: {lab: {ipv4_address: 172.31.250.33}}
  tls-strong:                 # TLS 1.2/1.3, ECDHE + AES-GCM, 2048-bit, in-date
    <<: *tls
    command: ["python", "/srv/tls_server.py", "strong"]
    networks: {lab: {ipv4_address: 172.31.250.32}}

  # ── databases ──────────────────────────────────────────────────────────────
  redis-noauth:
    image: redis:7.2
    command: ["redis-server", "--protected-mode", "no"]
    networks: {lab: {ipv4_address: 172.31.250.41}}
  redis-auth:
    image: redis:7.2
    command: ["redis-server", "--requirepass", "lab-only-not-a-secret"]
    networks: {lab: {ipv4_address: 172.31.250.42}}
  mongo-noauth:
    image: mongo:7.0
    networks: {lab: {ipv4_address: 172.31.250.43}}
  mariadb:
    image: mariadb:10.11
    environment: [MARIADB_ROOT_PASSWORD=lab-only-not-a-secret]
    networks: {lab: {ipv4_address: 172.31.250.44}}
  postgres:
    image: postgres:16
    environment: [POSTGRES_PASSWORD=lab-only-not-a-secret]
    networks: {lab: {ipv4_address: 172.31.250.45}}
