# VEDHA Manager — production stack (manager-only, no probe source).
#
# This file is what AWS / production deploys. It references only manager/
# source — probe never lands on this host.
#
# Run via deploy/aws/install.sh which adds the Caddy overlay and SSM secrets.
# For local dev use the root docker-compose.yml which includes probe too.
#
#   docker compose -f manager/docker-compose.yml up -d --build

name: vedha

# ── Shared image definition (backend + detection_engine baked in) ─────────────
# Build contexts are relative to THIS FILE'S directory (manager/).
x-backend-image: &backend-image
  build:
    context: ./backend
    additional_contexts:
      # detection_engine baked into the image — never mounted at runtime.
      # Probe code is in a separate sparse-checkout slice and never present here.
      detection_engine: ./detection_engine
    args:
      INSTALL_EXTRAS: ${INSTALL_EXTRAS:-0}
      VEDHA_VERSION: ${VEDHA_VERSION:-dev}
  image: ${VEDHA_BACKEND_IMAGE:-vedha-backend:local}
  pull_policy: never   # always use locally-built image; prevents stale registry pull

# ── Shared backend environment ────────────────────────────────────────────────
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vapt}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-vapt_db}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — run deploy/aws/install.sh or openssl rand -base64 48}
  PROBE_POLICY_SIGNING_KEY: ${PROBE_POLICY_SIGNING_KEY:-}
  APP_ENV: ${APP_ENV:-development}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  NEO4J_ENABLED: ${NEO4J_ENABLED:-false}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-180}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://vedha.local}
  OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Vedha}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  DETECTION_ENGINE_PATH: /opt/detection_engine

services:
  # ── Infrastructure ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vapt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-vapt_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # NOT published to host — API reaches Postgres over the compose network only.
    # Opening 5432 to the host bypasses the SG-level control. Do not uncomment.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vapt} -d ${POSTGRES_DB:-vapt_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    # NOT published to host — internal compose network only.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── Neo4j (optional attack-path graph) ───────────────────────────────────────
  neo4j:
    image: neo4j:5
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set when graph profile is enabled}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    # SECURITY: these ports are intentionally NOT published to the host.
    # Access Neo4j via docker compose exec neo4j cypher-shell or a VPN tunnel.
    # If you must expose for debugging, bind to 127.0.0.1 only.
    # ports:
    #   - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
    #   - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── One-shot migration + admin seed ─────────────────────────────────────────
  migrate:
    <<: [*backend-image]
    environment:
      <<: *backend-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@vedha.io}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set}
      SEED_TENANT_NAME: ${SEED_TENANT_NAME:-Default Tenant}
      SEED_ADMIN_FORCE_RESET: ${SEED_ADMIN_FORCE_RESET:-false}
    command: >
      sh -c "
        echo '[migrate] running alembic upgrade...' &&
        alembic upgrade head &&
        echo '[migrate] seeding admin...' &&
        python scripts/seed_admin.py &&
        echo '[migrate] done.'
      "
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

  # ── API (FastAPI) ─────────────────────────────────────────────────────────────
  api:
    <<: [*backend-image]
    environment:
      <<: *backend-env
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "${API_WORKERS:-2}"
      - --proxy-headers           # trust X-Forwarded-For from Caddy
      - --forwarded-allow-ips
      - "*"
      - --timeout-graceful-shutdown
      - "30"
    # SECURITY: bind to 127.0.0.1 only — Caddy reaches this via compose network.
    # Do NOT change to 0.0.0.0 — that exposes the raw API past the reverse proxy.
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

  # ── Background Worker ─────────────────────────────────────────────────────────
  worker:
    <<: [*backend-image]
    environment:
      <<: *backend-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    command: ["python", "-m", "app.workers.outbox"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

  # ── Ollama (optional local LLM — skip on AWS, use cloud LLM instead) ─────────
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama-model-init:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_models:/root/.ollama
    command: ["pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ── Frontend (Next.js BFF) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    image: ${VEDHA_FRONTEND_IMAGE:-vedha-frontend:local}
    pull_policy: never
    profiles: ["ui"]
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
      MANAGER_PUBLIC_URL: ${MANAGER_PUBLIC_URL:?MANAGER_PUBLIC_URL must be the public HTTPS API endpoint}
      AUTH_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-strict}
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
    # SECURITY: bind to 127.0.0.1 — Caddy reaches frontend over compose network.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null || wget -qO- http://127.0.0.1:3000/ 2>/dev/null | grep -q 'html' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

volumes:
  pgdata:
  redisdata:
  neo4jdata:
  ollama_models:
