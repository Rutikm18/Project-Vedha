# ─────────────────────────────────────────────────────────────────────────────
# VEDHA Dashboard — standalone development launcher
#
# The canonical product stack is ../../docker-compose.yml. This file launches
# the same dashboard against an already-running Manager API; it is not a second
# control plane and has no scanner binaries or network capabilities.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Production ──────────────────────────────────────────────────────────────
  vedha:
    container_name: vedha-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: vedha-dashboard:latest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://host.docker.internal:18080}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-at-least-32-chars-long!!}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    profiles: [prod]

  # ── Development (hot reload; Manager API must already be running) ───────────
  vedha-dev:
    container_name: vedha-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: vedha-dashboard:dev
    working_dir: /app
    # Override to run dev server; mount source for hot reload
    command: sh -c "npm install --prefer-offline 2>/dev/null; npm run dev"
    ports:
      - "${DEV_PORT:-3001}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://host.docker.internal:18080}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-at-least-32-chars-long!!}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: [dev]
