<!doctype html>
<html><head><meta charset="utf-8"><link rel="icon" href="data:,">
<style>
@font-face { font-family: "Instrument Serif"; font-weight: 400; src: url(/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Geist Sans"; font-weight: 400; src: url(/node_modules/@fontsource/geist-sans/files/geist-sans-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Geist Sans"; font-weight: 500; src: url(/node_modules/@fontsource/geist-sans/files/geist-sans-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Geist Sans"; font-weight: 600; src: url(/node_modules/@fontsource/geist-sans/files/geist-sans-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Geist Mono"; font-weight: 400; src: url(/node_modules/@fontsource/geist-mono/files/geist-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Geist Mono"; font-weight: 500; src: url(/node_modules/@fontsource/geist-mono/files/geist-mono-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Tiro Devanagari Hindi"; font-weight: 400; src: url(/node_modules/@fontsource/tiro-devanagari-hindi/files/tiro-devanagari-hindi-devanagari-400-normal.woff2) format("woff2"); unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+25CC, U+A830-A839, U+A8E0-A8FF; }
@font-face { font-family: "Tiro Devanagari Hindi"; font-weight: 400; src: url(/node_modules/@fontsource/tiro-devanagari-hindi/files/tiro-devanagari-hindi-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
html, body { margin: 0; background: #060B14; }
canvas { display: block; }
</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { renderFrame, renderPoster } from '/src/film.js';
const q = new URLSearchParams(location.search);
const lang = q.get('lang') || 'en';
const [en, data, local] = await Promise.all([
  fetch('/src/copy.en.json').then(r => r.json()),
  fetch('/src/data.illustrative.json').then(r => r.json()),
  lang === 'en' ? {} : fetch(`/src/copy.${lang}.json`).then(r => r.json()),
]);
// Untranslated keys (name, URL, device labels, UI strings) fall back to English.
const copy = { ...en, ...local };
// Hook variants for testing: A = the main hook, B = the path list, C = the promise.
const HOOKS = { B: copy.list.join('\n'), C: [copy.find, copy.prove, copy.fix].join('\n') };
if (HOOKS[q.get('hook')]) copy.hook = HOOKS[q.get('hook')];
const cfg = { aspect: q.get('aspect') || '4x5', width: +q.get('w') || 1080, height: +q.get('h') || 1350,
  debug: q.get('debug') === '1', copy, ...data };
if (q.get('hookPx')) copy.hookPx = +q.get('hookPx');
const c = document.getElementById('c'); c.width = cfg.width; c.height = cfg.height;
const ctx = c.getContext('2d');
const faces = ['400 40px "Instrument Serif"', '400 40px "Geist Sans"', '500 40px "Geist Sans"', '600 40px "Geist Sans"',
  '400 40px "Geist Mono"', '500 40px "Geist Mono"', '400 40px "Tiro Devanagari Hindi"'];
await Promise.all(faces.map(f => document.fonts.load(f, f.includes('Tiro') ? 'वेधा' : 'Ag')));
await document.fonts.ready;
window.renderFrame = n => { renderFrame(ctx, n, cfg); return true; };
window.grab = n => { renderFrame(ctx, n, cfg); return c.toDataURL('image/png'); };
window.poster = () => { renderPoster(ctx, cfg); return c.toDataURL('image/png'); };
window.ready = true;
</script></body></html>
